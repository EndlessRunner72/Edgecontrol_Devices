<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Fleet Dashboard</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 30px; background: #f4f4f4; }
        /* Status Bar Styling */
        #status { margin-bottom: 30px; font-weight: bold; font-size: 16px; color: #666; }
        /* Container for multiple cards */
        #dashboard-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        /* Individual Card Styling */
        .card {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            margin: 10px;
            width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .device-header { font-weight: bold; color: #aaa; margin-bottom: 5px; }
        .meter-type { color: #4dabf7; font-size: 0.9rem; margin-bottom: 2px; }
        .device-id { color: #888; font-size: 0.8rem; margin-bottom: 15px; }

        .pulse-count { font-size: 0.9rem; color: #fff; margin-top: 10px; }
        .kwh-display { font-size: 2.5rem; font-weight: bold; color: #2ecc71; line-height: 1.2; }
        .cost-display { font-size: 1.3rem; color: #f1c40f; margin-top: 5px; }
        .card:hover { transform: translateY(-5px); }
        .clickLabel { font-size: 60px; color: #0078d4; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>
    
    <div id="status">🔄 Initializing Connection...</div>

    <div id="dashboard-container"></div>

    <script>
        // 1. CONFIGURATION
        const hubName = "edgecontrol-hub-2026";
        const deviceId = "web-dashboard-01";
        const sasToken = "SharedAccessSignature sr=edgecontrol-hub-2026.azure-devices.net%2Fdevices%2Fweb-dashboard-01&sig=rbvvOYCX5dZDqV7r7LrUrF7rEoG1W9GKZqqdSLl922o%3D&se=1806135184"; 

        const host = `wss://${hubName}.azure-devices.net:443/$iothub/websocket?iothub-no-client-cert=true`;

        const options = {
            clientId: deviceId,
            username: `${hubName}.azure-devices.net/${deviceId}/?api-version=2021-04-12`,
            password: sasToken,
            protocol: 'wss',
            protocolVersion: 4,
            clean: true,
            rejectUnauthorized: false
        };

        const client = mqtt.connect(host, options);

        // 2. STATUS UPDATES
        client.on('connect', () => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Connected to Azure ✅";
            statusDiv.style.color = "green";
            client.subscribe(`devices/${deviceId}/messages/devicebound/#`);
        });

        client.on('error', (err) => {
            document.getElementById('status').innerText = "❌ Connection Error: " + err.message;
            document.getElementById('status').style.color = "red";
        });

        client.on('offline', () => {
            document.getElementById('status').innerText = "⚠️ Status: Offline (Trying to reach Azure...)";
            document.getElementById('status').style.color = "orange";
        });

        // 3. MULTI-DEVICE MESSAGE LOGIC
        client.on('message', (topic, message) => {
            try {
                const payload = JSON.parse(message.toString());
                // We use buttonClicks as our pulse count
                const { buttonClicks, senderId } = payload; 

                if (senderId && buttonClicks !== undefined) {
                    // --- 1. LOGIC FOR ID REPLACEMENT ---
                    let displayId = (senderId === "ubuntu_gateway") ? "GJ34200078" : senderId;

                    // --- 2. CALCULATIONS ---
                    const pulses = buttonClicks;
                    const kwh = (pulses / 1000).toFixed(3); // 0.180 format
                    const inr = (kwh * 10).toFixed(1);      // 1.8 INR format

                    let card = document.getElementById(`card-${senderId}`);

                    // --- 3. TEMPLATE FOR THE CARD ---
                    const cardContent = `
                        <div class="device-header">Device</div>
                        <div class="sender-name">${senderId}</div>
                        <div class="meter-type">1Ph-Energy-Meter</div>
                        <div class="device-id">ID:${displayId}</div>
                        <hr style="border: 0.5px solid #444; margin: 10px 0;">
                        
                        <div class="pulse-small">${pulses} pulses</div>
                        <div class="kwh-big">${kwh}</div>
                        <div class="inr-med">${inr} INR</div>
                    `;

                    // Create card if it doesn't exist
                    if (!card) {
                        card = document.createElement('div');
                        card.id = `card-${senderId}`;
                        card.className = 'card';
                        document.getElementById('dashboard-container').appendChild(card);
                    }

                    // Update the card content
                    // Note: We update every time to ensure kwh/inr stay current
                    card.innerHTML = cardContent;
                }
            } catch (e) {
                console.error("Data Parse Error:", e);
            }
        });
    </script>
</body>
</html>
